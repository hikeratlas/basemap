name: Merge multiple layers

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        default: north-america
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''
  workflow_call:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        required: true
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''

jobs:
  build:
    # arm64, like the layers: more real cores for the parallel merge, and
    # more free disk. go-pmtiles' image is multi-arch.
    runs-on: ubuntu-24.04-arm
    env:
      AREA: ${{ inputs.area }}
      # Where outputs go in R2: geojsonl/<ns>/, layers/<ns>/, <ns>.pmtiles
      NAMESPACE: ${{ inputs.namespace || inputs.area }}

    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Runner details, a waterfall of the steps, and CPU, memory, disk and
      # network charts in the job summary; the numbers go to the log too. Needs
      # the checkout, so it doesn't sample the steps above.
      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      # Pull the go-pmtiles image in the background, so it overlaps with
      # building the style and fetching the layers. A plain pull, not
      # bin/docker-pmtiles: that would make Docker create /mnt/layers and
      # /mnt/out as root.
      - name: Pre-fetch go-pmtiles image
        run: nohup docker pull "$(sed -n 's/^IMAGE=//p' bin/docker-pmtiles)" > "$RUNNER_TEMP/pmtiles-prefetch.log" 2>&1 &

      - name: Read area config
        id: area
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | tee -a "$GITHUB_OUTPUT"

      # A pinned version lets setup-bun use its cache; "latest" downloads from
      # bun.sh every time, which once took 2.5 minutes of retries after a 522.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install mapt
        run: bun rm mapt && bun add https://github.com/cldellow/mapt

      # Stitch styles/*.json into one stylesheet that points at this build's
      # tiles, so the website can preview it with ?build=<namespace>. The
      # north-america build also publishes it as the root style.json, which
      # the site loads without ?build=. It only needs the repo, not the
      # tiles, so it's built before the merge (a broken style fails in
      # seconds, not after it) and uploaded after the tiles, which it may need.
      - name: Build style
        run: |
          bun mapt style "https://public.hikeratlas.com/$NAMESPACE.pmtiles" > "$RUNNER_TEMP/style.json"
          jq -e '.layers | length > 0' "$RUNNER_TEMP/style.json" > /dev/null
          bin/pin-sprites "$RUNNER_TEMP/style.json"

      # No "Maximize build space" step: arm64 runners start with ~107G free on
      # /. north-america peaks around 43G here: the layers (21G) and the
      # merged output (22G). The merge writes its tiles straight into the
      # output, with no temporary copy.

      - name: Fetch tiles
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        # Only the .pmtiles: older builds also left .mbtiles layers here.
        run: |
          sudo mkdir -p /mnt/layers /mnt/out
          sudo chown runner:docker /mnt/layers /mnt/out
          cd /mnt/layers
          # One `aws s3 cp` per layer, all at once, each with the CLI's defaults
          # (10 concurrent 8MB parts). Fetching the 21G of north-america layers:
          #   aws s3 sync, defaults:                      79-123s
          #   aws s3 sync, 32 concurrent 64MB parts:     224-333s
          #   one aws s3 cp per file, in parallel:        67s (~320MB/s)
          #   s5cmd:                                      70s
          # ~320MB/s is also what the single-file PBF fetch gets: the network.
          set -o pipefail
          start=$(date +%s)
          # trailareas.pmtiles and hikingroutes.pmtiles are for
          # hikeratlas/routes only (see tilemaker-layers.yml): leave them out
          # of the map.
          aws s3 ls "s3://hikes-public/layers/$NAMESPACE/" | awk '$4 ~ /\.pmtiles$/ && $4 != "trailareas.pmtiles" && $4 != "hikingroutes.pmtiles" {print $4}' > layers.txt
          [ -s layers.txt ] || { echo "::error::No layers in layers/$NAMESPACE/"; exit 1; }
          xargs -P 16 -I{} aws s3 cp --no-progress --only-show-errors "s3://hikes-public/layers/$NAMESPACE/{}" {} < layers.txt
          rm layers.txt
          echo "Fetched $(du -sh . | cut -f1) in $(( $(date +%s) - start ))s"
          ls -l

      # Each layer has its own vector layers, so tiles that several layers
      # cover are combined by concatenating them. This replaces tile-smush
      # (mbtiles -> merged.mbtiles) followed by `pmtiles convert`.
      - name: Merge layers
        run: |
          df -h / /mnt
          start=$(date +%s)
          # --no-progress: on north-america the progress bar adds thousands of
          # lines to the log. The log lines (tiles merged, timings) stay.
          ./bin/docker-pmtiles --no-progress merge --tile-compression=zstd /mnt/layers/*.pmtiles /mnt/out/tiles.pmtiles
          echo "Merged in $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l /mnt/out
          df -h / /mnt
          ./bin/docker-pmtiles verify /mnt/out/tiles.pmtiles
          ./bin/docker-pmtiles show /mnt/out/tiles.pmtiles | tee /mnt/out/show.txt
          # The website decodes zstd tiles itself; fail if they are not.
          grep -q '^tile compression: zstd$' /mnt/out/show.txt

      - name: Upload tiles
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
        # The defaults (10 concurrent 8MB parts) upload the ~22G pmtiles at
        # 60-130 MB/s; use more, bigger parts.
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 128MB
          ls -l /mnt/out/tiles.pmtiles
          start=$(date +%s)
          # no-cache: browsers keep tile ranges but revalidate them (a 304
          # via ETag) instead of reusing a previous build's ranges for hours
          # after a join. pmtiles.js only refetches once it sees a mismatched
          # ETag, which it never does if every range comes from disk.
          aws s3 cp --no-progress --cache-control no-cache /mnt/out/tiles.pmtiles s3://hikes-public/"$NAMESPACE".pmtiles
          echo "Uploaded in $(( $(date +%s) - start ))s"
          echo "Published https://public.hikeratlas.com/$NAMESPACE.pmtiles" | tee -a "$GITHUB_STEP_SUMMARY"

      # Cache-Control: no-cache lets browsers keep the style but makes them
      # revalidate it (a cheap 304 via ETag) on every load. Without a header,
      # browsers cache it for a heuristic while, and a new style could take
      # hours to show up.
      - name: Publish style
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp --no-progress --content-type application/json --cache-control no-cache \
            "$RUNNER_TEMP/style.json" "s3://hikes-public/$NAMESPACE.style.json"
          {
            echo "Published https://public.hikeratlas.com/$NAMESPACE.style.json"
            echo
            echo "Preview: https://www.hikeratlas.com/map?build=$NAMESPACE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The site's default style. Only north-america: its tiles are the
          # ones the root style points at.
          if [ "$NAMESPACE" = north-america ]; then
            aws s3 cp --no-progress --content-type application/json --cache-control no-cache \
              "$RUNNER_TEMP/style.json" s3://hikes-public/style.json
            echo "Published https://public.hikeratlas.com/style.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # The main site's search uses the north-america build, so redeploy it with
  # this build's autosuggest DB once the tiles are live.
  deploy-search:
    needs: build
    if: (inputs.namespace || inputs.area) == 'north-america'
    permissions:
      contents: read
      id-token: write  # deploy-search logs in to AWS with OIDC
    uses: ./.github/workflows/deploy-search.yml
    with:
      namespace: north-america
    secrets: inherit
