name: Mirror PBFs from Geofabrik

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to mirror; must be a key in areas.json
        type: string
        default: north-america

jobs:
  mirror:
    runs-on: ubuntu-24.04-arm
    env:
      AREA: ${{ inputs.area }}
      # For bin/upload-pbf.
      AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # R2 sometimes fails a request (e.g. a 500 InternalError); let the
      # CLI retry those, as tile-join's upload does.
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: 10

    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"

      - uses: actions/checkout@v7

      # Runner details, a waterfall of the steps, and CPU, memory, disk and
      # network charts in the job summary; the numbers go to the log too. Needs
      # the checkout, so it doesn't sample the steps above.
      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      - name: Read area config
        id: area
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | tee -a "$GITHUB_OUTPUT"

      # "geofabrik" is one Geofabrik extract, or several separated by spaces,
      # merged below: north-america is Canada's and the US's, without Mexico,
      # Greenland or Saint-Pierre-et-Miquelon (#158). Their land still shows
      # (it's drawn from the coastline's water polygons), with nothing on it.
      - name: Fetch PBFs
        env:
          GEOFABRIK: ${{ steps.area.outputs.geofabrik }}
        run: |
          for g in $GEOFABRIK; do
            wget --progress=dot:giga "https://download.geofabrik.de/${g}-latest.osm.pbf" -O "part-$(basename "$g").pbf"
          done
          ls -l part-*.pbf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version

      # An area of several extracts publishes each of them too, as the area
      # named for its last part (north-america/canada as canada, and
      # north-america/us as us; see areas.json), for builds and previews of
      # just that country. One at a time, so the disk holds at most one zstd
      # copy beside the downloads.
      - name: Publish each extract
        run: |
          set -- part-*.pbf
          [ $# -gt 1 ] || exit 0
          for f in "$@"; do
            name=${f#part-}; name=${name%.pbf}
            bin/zstd-pbf "$f" "$name".zstd.pbf
            bin/upload-pbf "$f" "$name".pbf
            bin/upload-pbf "$name".zstd.pbf
            rm "$name".zstd.pbf
          done

      # Several extracts are merged into one: a single pass over the sorted
      # files, keeping one copy of what's in both (the border). Much faster
      # than cutting north-america to the two countries with osmium extract
      # (#158's first try took 15.6 minutes).
      - name: Merge PBFs
        run: |
          set -- part-*.pbf
          if [ $# -eq 1 ]; then
            mv "$1" "$AREA".pbf
          else
            time osmium merge "$@" -o "$AREA".pbf --overwrite
            rm part-*.pbf
          fi
          ls -l "$AREA".pbf

      # The builds read <area>.zstd.pbf (see bin/zstd-pbf).
      - name: Make zstd PBF
        run: bin/zstd-pbf "$AREA".pbf "$AREA".zstd.pbf

      # The original (merged, if the area is several) is kept too, so builds
      # can switch back to it.
      - name: Upload PBFs
        run: |
          bin/upload-pbf "$AREA".pbf
          bin/upload-pbf "$AREA".zstd.pbf
