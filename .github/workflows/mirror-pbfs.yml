name: Mirror PBFs from Geofabrik
# The area in the run's title, e.g. "Mirror canada (from R2)".
run-name: Mirror ${{ inputs.area }}${{ !inputs.fetch && ' (from R2)' || '' }}

# Two stages:
# - fetch: the area's Geofabrik extract, uploaded unchanged to R2 as
#   pbfs/raw/<area>.osm.pbf (only the latest is kept);
# - derive, from that: the PBF the builds read, pbfs/<area>.zstd.pbf
#   (zstd blocks, no metadata). A tool that can't read zstd converts it
#   back itself (`pbf-filter recompress --zlib`, as lake-centerlines.yml
#   does).
# An area made of other areas (e.g. north-america: canada and us) has no
# fetch: derive merges what the parts' runs published, so run those first.
# Derive also writes, for builds to read instead (bin/fetch-pbf), each
# group's filtered PBF, pbfs/filtered/<area>/<group>.zstd.pbf: just what
# the group's profiles (pbf-groups.json) read; and the relations sidecar,
# pbfs/<area>.relations.pbf, that `pbf-filter check` needs to tell whether
# a filtered PBF still serves changed profiles.
# With fetch off, derive reuses the extract already in R2, skipping the
# slow download from Geofabrik: what a build on main starts when it finds a
# filtered PBF stale. hikeratlas/pbf-filter does the PBF work.

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to mirror; must be a key in areas.json
        type: string
        default: north-america
      fetch:
        description: Download the extract from Geofabrik first (off reuses R2's pbfs/raw/; ignored for areas made of parts)
        type: boolean
        default: true

# One run per area at a time; more queue (a stale filtered PBF may start
# several from one build).
concurrency:
  group: mirror-pbfs-${{ inputs.area }}
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror ${{ inputs.area }}
    runs-on: ubuntu-24.04-arm
    env:
      AREA: ${{ inputs.area }}
      # For bin/upload-pbf.
      AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # R2 sometimes fails a request (e.g. a 500 InternalError); let the
      # CLI retry those, as tile-join's upload does.
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: 10

    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"

      - uses: actions/checkout@v7

      # Runner details, a waterfall of the steps, and CPU, memory, disk and
      # network charts in the job summary; the numbers go to the log too. Needs
      # the checkout, so it doesn't sample the steps above.
      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      - name: Read area config
        id: area
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | tee -a "$GITHUB_OUTPUT"

      - name: Install pbf-filter
        # The release named in .pbf-filter-version.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/bin/pbf-filter" \
            "https://github.com/hikeratlas/pbf-filter/releases/download/$(cat .pbf-filter-version)/pbf-filter-aarch64-linux"
          chmod +x "$RUNNER_TEMP/bin/pbf-filter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # An area is one Geofabrik extract ("geofabrik" in areas.json), kept in
      # R2 as it came (pbfs/raw/<area>.osm.pbf) so derive can rerun without
      # Geofabrik; or several other areas merged ("parts"), read from what
      # their own runs published. north-america is canada's and us's,
      # without Mexico, Greenland or Saint-Pierre-et-Miquelon (#158); their
      # land still shows (it's drawn from the coastline's water polygons),
      # with nothing on it. Mirror the parts first.
      - name: Fetch the extract from Geofabrik
        if: ${{ steps.area.outputs.geofabrik && inputs.fetch }}
        env:
          GEOFABRIK: ${{ steps.area.outputs.geofabrik }}
        run: |
          wget --progress=dot:giga "https://download.geofabrik.de/${GEOFABRIK}-latest.osm.pbf" -O source.pbf
          bin/upload-pbf source.pbf "raw/$AREA.osm.pbf"

      # The area's PBF is remade only when it's missing or older than what
      # it's made from (the raw extract, or any part's PBF); otherwise, e.g.
      # when a changed profile leaves a filtered PBF stale, the published
      # one is reused and only the filtered PBFs are made again.
      - name: Decide whether to make the area's PBF
        id: plan
        env:
          PARTS: ${{ steps.area.outputs.parts }}
        run: |
          modified() {  # epoch seconds of pbfs/$1's last change, or nothing
            local m
            m=$(aws s3api head-object --bucket hikes-public --key "pbfs/$1" --query LastModified --output text 2>/dev/null) \
              && date -d "$m" +%s
          }
          if [ -n "$PARTS" ]; then
            mapfile -t sources < <(jq -r --arg a "$AREA" '.[$a].parts[] | "\(.).zstd.pbf"' areas.json)
          else
            sources=("raw/$AREA.osm.pbf")
          fi
          newest=0 oldest=
          for s in "${sources[@]}"; do
            if ! t=$(modified "$s"); then
              echo "::error::pbfs/$s isn't in R2: run this workflow for $(basename "${s%%.*}") first"
              exit 1
            fi
            echo "pbfs/$s: $(date -ud "@$t")"
            (( t > newest )) && newest=$t
            (( ${oldest:-t} >= t )) && oldest=$t
          done
          if [ -n "$PARTS" ] && (( newest - oldest > 2 * 86400 )); then
            echo "::warning::The parts were published more than two days apart; mirror the older ones again for a consistent merge"
          fi
          if area=$(modified "$AREA.zstd.pbf") && (( area >= newest )); then
            echo "pbfs/$AREA.zstd.pbf: $(date -ud "@$area"), up to date: reusing it"
            echo "make=false" >> "$GITHUB_OUTPUT"
          else
            echo "pbfs/$AREA.zstd.pbf is missing or older than its source: making it"
            echo "make=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the area's PBF from R2
        if: ${{ steps.plan.outputs.make != 'true' }}
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          aws s3 cp --no-progress "s3://hikes-public/pbfs/$AREA.zstd.pbf" "$AREA".zstd.pbf

      - name: Fetch the extract from R2
        if: ${{ steps.plan.outputs.make == 'true' && steps.area.outputs.geofabrik && !inputs.fetch }}
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          aws s3 cp --no-progress "s3://hikes-public/pbfs/raw/$AREA.osm.pbf" source.pbf

      # The parts' derived PBFs: the same data as their raw extracts, but
      # smaller to download and quicker to merge.
      - name: Fetch the parts from R2
        if: ${{ steps.plan.outputs.make == 'true' && steps.area.outputs.parts }}
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          for p in $(jq -r --arg a "$AREA" '.[$a].parts[]' areas.json); do
            aws s3 cp --no-progress "s3://hikes-public/pbfs/$p.zstd.pbf" "part-$p.pbf"
          done
          ls -l part-*.pbf

      # Metadata (versions, timestamps, users), which tilemaker doesn't read,
      # is dropped, and the blocks are zstd, which cldellow/tilemaker reads
      # several times faster than zlib. Parts are merged in a single pass
      # over the sorted files, keeping one copy of what's in both (the
      # border).
      - name: Make the area's PBF
        if: ${{ steps.plan.outputs.make == 'true' }}
        run: |
          if [ -f source.pbf ]; then
            time pbf-filter recompress source.pbf "$AREA".zstd.pbf
            rm source.pbf
          else
            time pbf-filter merge "$AREA".zstd.pbf part-*.pbf
            rm part-*.pbf
          fi
          ls -l "$AREA".zstd.pbf

      - name: Upload the area's PBF
        if: ${{ steps.plan.outputs.make == 'true' }}
        run: bin/upload-pbf "$AREA".zstd.pbf

      # Each group's filtered PBF, from the area's: one read of it per group.
      - name: Make the filtered PBFs
        run: |
          mkdir -p filtered
          for group in $(jq -r 'keys[]' pbf-groups.json); do
            mapfile -t profiles < <(jq -r --arg g "$group" '.[$g][]' pbf-groups.json)
            time pbf-filter filter "$AREA".zstd.pbf "filtered/$group.zstd.pbf" "${profiles[@]}"
          done
          ls -l filtered

      - name: Make the relations sidecar
        run: time pbf-filter relations "$AREA".zstd.pbf "$AREA".relations.pbf

      - name: Upload the filtered PBFs and the relations sidecar
        run: |
          for f in filtered/*.zstd.pbf; do
            bin/upload-pbf "$f" "filtered/$AREA/$(basename "$f")"
          done
          bin/upload-pbf "$AREA".relations.pbf
