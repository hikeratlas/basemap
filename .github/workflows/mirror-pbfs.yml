name: Mirror PBFs from Geofabrik

# Two stages:
# - fetch: Geofabrik's extracts for the area, uploaded unchanged to R2 as
#   pbfs/raw/<extract>.osm.pbf (only the latest is kept);
# - derive, from those: the PBFs the builds read, pbfs/<area>.zstd.pbf
#   (zstd blocks, no metadata) and pbfs/<area>.pbf (the same with zlib
#   blocks, for tools that can't read zstd, e.g. osmium in
#   lake-centerlines.yml), and for an area of several extracts, each
#   extract's too.
# With fetch off, derive reuses the extracts already in R2, skipping the
# slow download from Geofabrik. hikeratlas/pbf-filter does the PBF work.

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to mirror; must be a key in areas.json
        type: string
        default: north-america
      fetch:
        description: Download the extracts from Geofabrik first (off reuses R2's pbfs/raw/)
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: ubuntu-24.04-arm
    env:
      AREA: ${{ inputs.area }}
      # hikeratlas/pbf-filter's release to use.
      PBF_FILTER_VERSION: v0.1.0
      # For bin/upload-pbf.
      AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # R2 sometimes fails a request (e.g. a 500 InternalError); let the
      # CLI retry those, as tile-join's upload does.
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: 10

    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"

      - uses: actions/checkout@v7

      # Runner details, a waterfall of the steps, and CPU, memory, disk and
      # network charts in the job summary; the numbers go to the log too. Needs
      # the checkout, so it doesn't sample the steps above.
      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      - name: Read area config
        id: area
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | tee -a "$GITHUB_OUTPUT"

      - name: Install pbf-filter
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/bin/pbf-filter" \
            "https://github.com/hikeratlas/pbf-filter/releases/download/$PBF_FILTER_VERSION/pbf-filter-aarch64-linux"
          chmod +x "$RUNNER_TEMP/bin/pbf-filter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # "geofabrik" is one Geofabrik extract, or several separated by spaces,
      # merged below: north-america is Canada's and the US's, without Mexico,
      # Greenland or Saint-Pierre-et-Miquelon (#158). Their land still shows
      # (it's drawn from the coastline's water polygons), with nothing on it.
      # Each is kept in R2 as it came, so derive can rerun without
      # Geofabrik.
      - name: Fetch the extracts from Geofabrik
        if: ${{ inputs.fetch }}
        env:
          GEOFABRIK: ${{ steps.area.outputs.geofabrik }}
        run: |
          for g in $GEOFABRIK; do
            name=$(basename "$g")
            wget --progress=dot:giga "https://download.geofabrik.de/${g}-latest.osm.pbf" -O "part-$name.pbf"
            bin/upload-pbf "part-$name.pbf" "raw/$name.osm.pbf"
          done
          ls -l part-*.pbf

      - name: Fetch the extracts from R2
        if: ${{ !inputs.fetch }}
        env:
          GEOFABRIK: ${{ steps.area.outputs.geofabrik }}
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          for g in $GEOFABRIK; do
            name=$(basename "$g")
            aws s3 cp --no-progress "s3://hikes-public/pbfs/raw/$name.osm.pbf" "part-$name.pbf"
          done
          ls -l part-*.pbf

      # An area of several extracts publishes each of them too, as the area
      # named for its last part (north-america/canada as canada, and
      # north-america/us as us; see areas.json), for builds and previews of
      # just that country. One at a time, to bound the disk.
      - name: Publish each extract
        run: |
          set -- part-*.pbf
          [ $# -gt 1 ] || exit 0
          for f in "$@"; do
            name=${f#part-}; name=${name%.pbf}
            pbf-filter recompress "$f" "$name".zstd.pbf
            pbf-filter recompress --zlib "$f" "$name".pbf
            bin/upload-pbf "$name".zstd.pbf
            bin/upload-pbf "$name".pbf
            rm "$name".zstd.pbf "$name".pbf
          done

      # Several extracts are merged into one: a single pass over the sorted
      # files, keeping one copy of what's in both (the border). Metadata
      # (versions, timestamps, users), which tilemaker doesn't read, is
      # dropped, and the blocks are zstd, which cldellow/tilemaker reads
      # several times faster than zlib.
      - name: Make the area's PBFs
        run: |
          set -- part-*.pbf
          if [ $# -eq 1 ]; then
            time pbf-filter recompress "$1" "$AREA".zstd.pbf
          else
            time pbf-filter merge "$AREA".zstd.pbf "$@"
          fi
          rm part-*.pbf
          # The same, in zlib blocks, for tools that don't read zstd.
          time pbf-filter recompress --zlib "$AREA".zstd.pbf "$AREA".pbf
          ls -l "$AREA".pbf "$AREA".zstd.pbf

      - name: Upload the area's PBFs
        run: |
          bin/upload-pbf "$AREA".pbf
          bin/upload-pbf "$AREA".zstd.pbf
