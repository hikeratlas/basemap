name: Merge multiple layers

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        default: north-america
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''
  workflow_call:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        required: true
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AREA: ${{ inputs.area }}
      # Where outputs go in R2: geojsonl/<ns>/, layers/<ns>/, <ns>.pmtiles
      NAMESPACE: ${{ inputs.namespace || inputs.area }}

    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"
          {
            echo "### Runner diagnostics"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | ${ImageOS:-?} ${ImageVersion:-?} |"
            echo "| VM size | ${VMSIZE:-unknown} (${LOCATION:-unknown}) |"
            echo "| CPU | $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1) |"
            echo "| vCPUs | $(nproc) |"
            echo "| RAM | $(free -h | awk '/^Mem:/ {print $2}') |"
            echo "| Swap | $(free -h | awk '/^Swap:/ {print $2}') |"
            echo "| Disk / | $(df -h / | awk 'NR==2 {print $2 " total, " $4 " free"}') |"
            echo "| Disk /mnt | $(df -h /mnt 2>/dev/null | awk 'NR==2 {print $2 " total, " $4 " free"}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: Read area config
        id: area
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | tee -a "$GITHUB_OUTPUT"

      # Only large areas need this: it takes ~3 minutes.
      - name: Maximize build space
        if: steps.area.outputs.free_disk == 'true'
        uses: AdityaGarg8/remove-unwanted-software@v5.1
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'

      - name: Fetch tiles
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: sudo mkdir /mnt/layers && sudo chown runner:docker /mnt/layers && cd /mnt/layers && aws s3 sync s3://hikes-public/layers/"$NAMESPACE"/ . --no-progress

      - name: tile-join
        #run: ./bin/docker-tile-join --no-tile-size-limit -o tiles.mbtiles /mnt/layers/*.mbtiles
        run: |
          df -h /
          du -sh /mnt/layers
          rv=0
          ./bin/docker-tile-smush /mnt/layers/*.mbtiles || rv=$?
          df -h /
          ls -l merged.mbtiles* || true
          exit $rv

      - name: Free up space
        run: df -h && rm -f /mnt/layers/*.mbtiles && ls -l /mnt/layers && df -h

      - name: convert to pmtiles
        run: ./bin/docker-pmtiles convert --quiet --tmpdir /mnt/layers merged.mbtiles /mnt/layers/tiles.pmtiles

      - name: Upload tiles
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
        # The defaults (10 concurrent 8MB parts) upload the ~22G pmtiles at
        # 60-130 MB/s; use more, bigger parts.
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 128MB
          ls -l /mnt/layers/tiles.pmtiles
          start=$(date +%s)
          aws s3 cp --no-progress /mnt/layers/tiles.pmtiles s3://hikes-public/"$NAMESPACE".pmtiles
          echo "Uploaded in $(( $(date +%s) - start ))s"
          echo "Published https://public.hikeratlas.com/$NAMESPACE.pmtiles" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@v1

      - name: Install mapt
        run: bun rm mapt && bun add https://github.com/cldellow/mapt

      # Stitch styles/*.json into one stylesheet that points at this build's
      # tiles, so the website can preview it with ?build=<namespace>. This
      # never touches the root style.json, which is published separately.
      - name: Publish style
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          bun mapt style "https://public.hikeratlas.com/$NAMESPACE.pmtiles" > "$RUNNER_TEMP/style.json"
          jq -e '.layers | length > 0' "$RUNNER_TEMP/style.json" > /dev/null
          aws s3 cp --no-progress --content-type application/json \
            "$RUNNER_TEMP/style.json" "s3://hikes-public/$NAMESPACE.style.json"
          {
            echo "Published https://public.hikeratlas.com/$NAMESPACE.style.json"
            echo
            echo "Preview: https://www.hikeratlas.com/map?build=$NAMESPACE"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The main site's search uses the north-america build, so redeploy it with
  # this build's autosuggest DB once the tiles are live.
  deploy-search:
    needs: build
    if: (inputs.namespace || inputs.area) == 'north-america'
    permissions:
      contents: read
      id-token: write  # deploy-search logs in to AWS with OIDC
    uses: ./.github/workflows/deploy-search.yml
    with:
      namespace: north-america
    secrets: inherit
