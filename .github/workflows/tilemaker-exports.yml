name: Build tilemaker exports

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        default: north-america
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''
      bbox:
        description: Only build this box (minlon,minlat,maxlon,maxlat) instead of the whole area, e.g. a PR's preview
        type: string
        default: ''
  workflow_call:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        required: true
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''
      bbox:
        description: Only build this box (minlon,minlat,maxlon,maxlat) instead of the whole area, e.g. a PR's preview
        type: string
        default: ''

jobs:
  # The exports that don't depend on any other export run in parallel. Keep
  # this list in sync with export/export-all.
  export:
    runs-on: ubuntu-24.04-arm
    env:
      AREA: ${{ inputs.area }}
      # Where outputs go in R2: geojsonl/<ns>/, layers/<ns>/, <ns>.pmtiles
      NAMESPACE: ${{ inputs.namespace || inputs.area }}

    strategy:
      matrix:
        export: [campgrounds, city-parks, countries, hiking-routes, parks, states, trails]

    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Runner details, a waterfall of the steps, and CPU, memory, disk and
      # network charts in the job summary; the numbers go to the log too. Needs
      # the checkout, so it doesn't sample the steps above.
      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      # Pull the tilemaker image in the background so it overlaps with the PBF
      # download. With no arguments, tilemaker prints its usage and exits.
      # Background processes keep running across steps until the job ends.
      - name: Pre-fetch tilemaker image
        run: nohup ./bin/docker-tilemaker > "$RUNNER_TEMP/tilemaker-prefetch.log" 2>&1 &

      - name: Read area config
        id: area
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | tee -a "$GITHUB_OUTPUT"

      # Fetch from R2 directly with many concurrent ranged GETs; a single wget
      # stream over the public URL tops out around 70 MB/s.
      - name: Fetch PBF
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
          GH_TOKEN: ${{ github.token }}
          EXPORT: ${{ matrix.export }}
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 64MB
          # Its group's filtered PBF if it still serves the profile, else
          # the whole one (bin/fetch-pbf, mirror-pbfs.yml).
          bin/fetch-pbf "$AREA" "$AREA.pbf" export/$EXPORT.lua

      - name: Export
        env:
          TILEMAKER: ${{ github.workspace }}/bin/docker-tilemaker
          # A preview build only exports its box; otherwise the area's, from
          # areas.json, as the layers use. tilemaker reads shapefiles (zindex)
          # only with a box, and a PBF made by osmium merge (north-america,
          # #158) has none in its header, unlike Geofabrik's.
          BBOX: ${{ inputs.bbox }}
          EXPORT: ${{ matrix.export }}
        # tilemaker's output, timestamped, for the phase timings below (#210)
        run: |
          set -o pipefail
          BBOX=${BBOX:-$(jq -r --arg a "$AREA" '.[$a].bbox' areas.json)} ./export/export $AREA.pbf "$EXPORT" 2>&1 \
            | python3 bin/timestamp-lines.py "$RUNNER_TEMP/tilemaker.log"

      - name: Phase timings
        if: always()
        continue-on-error: true
        uses: ./.github/actions/phase-timings
        with:
          name: export-${{ matrix.export }}

      - uses: actions/upload-artifact@v7
        with:
          name: geojsonl-${{ matrix.export }}
          path: ${{ matrix.export }}.geojsonl
          if-no-files-found: error
          retention-days: 1

      # Re-render build-area.yml's progress check with this job's results (#210)
      - name: Build progress
        if: always()
        continue-on-error: true
        uses: ./.github/actions/build-progress

  # Uploads the exports' GeoJSON to R2 once every one has succeeded, so R2
  # is only updated with a complete set. The layers read it from there, so
  # this is what they wait for; zindex (tilemaker-zindex.yml), which only
  # the search DB needs, runs on alongside them (#203).
  publish:
    needs: export
    runs-on: ubuntu-24.04-arm
    env:
      NAMESPACE: ${{ inputs.namespace || inputs.area }}
    steps:
      - name: Fetch the exports
        uses: actions/download-artifact@v8
        with:
          pattern: geojsonl-*
          merge-multiple: true

      - name: Upload GeoJSON
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: for x in *.geojsonl; do zstd -9 "$x"; aws s3 cp --no-progress "$x".zst s3://hikes-public/geojsonl/"$NAMESPACE"/"$x".zst; done
