name: Build area

# Runs the whole pipeline (exports -> layers -> tile-join) for one area.
#
# - Every push to main rebuilds nova-scotia into the "nova-scotia" namespace.
# - Every PR rebuilds nova-scotia into its own "pr-<number>/nova-scotia"
#   namespace, so PRs don't clobber main or each other. When the PR is
#   closed or merged, its outputs are deleted from R2.
# - Any area, including north-america, can be built by hand.
#
# Outputs go to R2 under the namespace (which defaults to the area name):
#   geojsonl/<namespace>/, layers/<namespace>/, <namespace>.pmtiles

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        default: nova-scotia
      namespace:
        description: R2 output name (defaults to the area), e.g. test/nova-scotia
        type: string
        default: ''

# One build per namespace at a time. A newer push or PR update supersedes an
# in-progress build, and closing a PR cancels its build before cleaning up;
# manual builds queue instead of being cancelled.
concurrency:
  group: >-
    build-area-${{
      github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || inputs.namespace || inputs.area || 'nova-scotia'
    }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  config:
    # PRs from forks don't get the R2 secrets, so skip them. Closed PRs are
    # handled by the cleanup job instead.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.action != 'closed')
    runs-on: ubuntu-24.04-arm
    outputs:
      area: ${{ steps.config.outputs.area }}
      namespace: ${{ steps.config.outputs.namespace }}
    steps:
      - id: config
        env:
          AREA: ${{ inputs.area || 'nova-scotia' }}
          NAMESPACE: >-
            ${{
              github.event_name == 'pull_request'
              && format('pr-{0}/{1}', github.event.pull_request.number, inputs.area || 'nova-scotia')
              || inputs.namespace || inputs.area || 'nova-scotia'
            }}
        run: |
          echo "area=$AREA" | tee -a "$GITHUB_OUTPUT"
          echo "namespace=$NAMESPACE" | tee -a "$GITHUB_OUTPUT"
          echo "Building **$AREA** into \`$NAMESPACE\`" >> "$GITHUB_STEP_SUMMARY"

  exports:
    needs: config
    uses: ./.github/workflows/tilemaker-exports.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
    secrets: inherit

  layers:
    needs: [config, exports]
    uses: ./.github/workflows/tilemaker-layers.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
    secrets: inherit

  tile-join:
    needs: [config, layers]
    # tile-join calls deploy-search for north-america builds, which logs in to
    # AWS with OIDC. A called workflow can't have more permissions than this.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tile-join.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
    secrets: inherit

  # Post (or update) a PR comment linking to the website preview of this build.
  comment:
    needs: [config, tile-join]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      NAMESPACE: ${{ needs.config.outputs.namespace }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Comment with preview link
        run: |
          marker='<!-- build-area-preview -->'
          body="$marker
          **Preview of ${SHA:0:7}:** https://www.hikeratlas.com/map?build=$NAMESPACE

          Tiles: https://public.hikeratlas.com/$NAMESPACE.pmtiles
          Style: https://public.hikeratlas.com/$NAMESPACE.style.json"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  cleanup:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/cleanup-pr.yml
    with:
      pr: ${{ github.event.pull_request.number }}
    secrets: inherit
