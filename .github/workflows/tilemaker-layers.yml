name: Build tilemaker layers

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        default: north-america
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''
  workflow_call:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        required: true
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''

jobs:
  build:
    # arm64 runners have 4 full cores, where x64 ones have 2 cores with 2
    # hyperthreads each. On north-america, tilemaker built the layers 1.48x
    # faster on them (ways: 29 -> 20 minutes); see hikeratlas/basemap#52.
    # The tilemaker image is multi-arch.
    runs-on: ubuntu-24.04-arm
    env:
      AREA: ${{ inputs.area }}
      # Where outputs go in R2: geojsonl/<ns>/, layers/<ns>/, <ns>.pmtiles
      NAMESPACE: ${{ inputs.namespace || inputs.area }}

    strategy:
      matrix:
        layer: [
          boundaries,
          buildings,
          land,
          parks,
          peaks,
          places,
          pois,
          water,
          ways
        ]
    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"
          {
            echo "### Runner diagnostics"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | ${ImageOS:-?} ${ImageVersion:-?} |"
            echo "| VM size | ${VMSIZE:-unknown} (${LOCATION:-unknown}) |"
            echo "| CPU | $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1) |"
            echo "| vCPUs | $(nproc) |"
            echo "| RAM | $(free -h | awk '/^Mem:/ {print $2}') |"
            echo "| Swap | $(free -h | awk '/^Swap:/ {print $2}') |"
            echo "| Disk / | $(df -h / | awk 'NR==2 {print $2 " total, " $4 " free"}') |"
            echo "| Disk /mnt | $(df -h /mnt 2>/dev/null | awk 'NR==2 {print $2 " total, " $4 " free"}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # No "Maximize build space" step: arm64 runners start with ~107G free
      # on /, and the largest layer (ways) peaks around 45G (15.8G PBF + ~21G
      # tilemaker store + output). The cleanup took 1-2.5 minutes per job.

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Pull the tilemaker image in the background so it overlaps with the PBF
      # download. With no arguments, tilemaker prints its usage and exits.
      # Background processes keep running across steps until the job ends.
      - name: Pre-fetch tilemaker image
        run: nohup ./bin/docker-tilemaker > "$RUNNER_TEMP/tilemaker-prefetch.log" 2>&1 &

      - name: Read area config
        id: area
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | tee -a "$GITHUB_OUTPUT"

      # A pinned version lets setup-bun use its cache; "latest" downloads from
      # bun.sh every time, which once took 2.5 minutes of retries after a 522.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install mapt
        run: bun rm mapt && bun add https://github.com/cldellow/mapt

      # Fetch from R2 directly with many concurrent ranged GETs; a single wget
      # stream over the public URL tops out around 70 MB/s.
      - name: Fetch PBF
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 64MB
          start=$(date +%s)
          aws s3 cp --no-progress "s3://hikes-public/pbfs/$AREA.pbf" "$AREA.pbf"
          secs=$(( $(date +%s) - start ))
          echo "Downloaded $(( $(stat -c %s "$AREA.pbf") / 1048576 )) MiB in ${secs}s"

      - name: Fetch supporting GeoJSON and QRank files
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: wget --progress=dot:giga https://github.com/hikeratlas/qrank/releases/download/latest/qrank.db && aws s3 sync "s3://hikes-public/geojsonl/$NAMESPACE/" . --no-progress && unzstd *.zst


      # The coastline is an 865MB zip from osmdata.openstreetmap.de that downloads
      # at ~20 MB/s and takes ~10s to unzip, so cache the unzipped shapefiles.
      # The upstream data changes daily; keying by ISO week refreshes it weekly.
      - name: Compute coastline cache key
        if: ${{ startsWith(matrix.layer, 'boundaries') }}
        id: coastline-key
        run: echo "week=$(date -u +%G-W%V)" | tee -a "$GITHUB_OUTPUT"

      - name: Restore cached coastline
        if: ${{ startsWith(matrix.layer, 'boundaries') }}
        id: coastline-cache
        uses: actions/cache@v4
        with:
          path: slices/coastline
          key: coastline-${{ steps.coastline-key.outputs.week }}

      - name: Fetch coastline
        if: ${{ startsWith(matrix.layer, 'boundaries') && steps.coastline-cache.outputs.cache-hit != 'true' }}
        run: wget --progress=dot:giga https://osmdata.openstreetmap.de/download/water-polygons-split-4326.zip && unzip water-polygons-split-4326.zip && mv water-polygons-split-4326 slices/coastline

      - name: Build layer
        env:
          TILEMAKER: ${{ github.workspace }}/bin/docker-tilemaker
          LAYER: ${{ matrix.layer }}
          BBOX: ${{ steps.area.outputs.bbox }}
        run: bun mapt build "$AREA".pbf $LAYER -- --store /mnt/store --fast ${BBOX:+--bbox "$BBOX"}

      # The slices ask tilemaker for zstd tiles. Byte 98 of a PMTiles v3
      # header is the tile compression, and 4 means zstd.
      - name: Check tile compression
        env:
          FILE: ${{ matrix.layer }}.pmtiles
        run: |
          c=$(od -An -tu1 -j98 -N1 "$FILE" | tr -d ' ')
          echo "$FILE: tile compression $c"
          [ "$c" = 2 ] || { echo "::error::$FILE does not have gzip tiles"; exit 1; }

      - name: Upload layer tiles
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
          FILE: ${{ matrix.layer }}.pmtiles
        run: |
          aws configure set default.s3.multipart_chunksize 128MB
          for i in 1 2 3 4; do
            aws s3 cp --no-progress "$FILE" "s3://hikes-public/layers/$NAMESPACE/$FILE" && exit 0
            echo "Upload attempt $i failed; retrying in $((i*30))s"
            sleep $((i*30))
          done
          exit 1
