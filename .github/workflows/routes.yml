name: Curate routes

# Curates hikes for every park in a build with hikeratlas/routes, reading
# the build's own layer tiles. The parks are split over SHARDS machines
# (routes --shard), whose results one more job merges (routes --merge). It
# writes:
#   layers/<ns>/routes.pmtiles      the "route" layer, joined into the map
#   routes/<ns>/<park osm id>.json  each park's routes in full, for the website

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area whose layers to read; must be a key in areas.json
        type: string
        default: north-america
      namespace:
        description: R2 namespace (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''
  workflow_call:
    inputs:
      area:
        type: string
        required: true
      namespace:
        type: string
        default: ''

env:
  # Pinned, so a change there shows up here as a reviewed bump.
  ROUTES_REF: 9bd9608b6402792f349fe773edd06a6c197a07ba

jobs:
  curate:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      # Must match SHARDS below. North America on one machine took 101 min to
      # curate (run 42053576296); split four ways, each shard gets about a
      # quarter of the parks, by tile count.
      matrix:
        shard: [0, 1, 2, 3]
    # tile-join waits for these jobs, so a bad run mustn't hold up the map
    # for long: a shard should take 10-20 min. A slow park is cut short by
    # PARK_TIMEOUT instead, and named in the summary.
    timeout-minutes: 45
    env:
      SHARDS: 4
      # Seconds. The slowest park (the Mississippi NRRA) takes ~2 min.
      PARK_TIMEOUT: 180
      AREA: ${{ inputs.area }}
      NAMESPACE: ${{ inputs.namespace || inputs.area }}
      AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: hikeratlas/routes
          ref: ${{ env.ROUTES_REF }}
          path: routes-src

      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      - name: Pre-fetch tilemaker image
        run: nohup ./bin/docker-tilemaker > "$RUNNER_TEMP/tilemaker-prefetch.log" 2>&1 &

      # Building takes ~1 minute, so the binary is cached per pinned commit:
      # only the first build after a bump compiles it.
      - name: Restore hikeratlas/routes binary
        id: routes-cache
        uses: actions/cache@v6
        with:
          path: routes-src/target/release/routes
          key: routes-bin-${{ runner.arch }}-${{ env.ROUTES_REF }}

      - name: Build hikeratlas/routes
        if: steps.routes-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --manifest-path routes-src/Cargo.toml

      # /mnt has more room than the workspace.
      - name: Fetch the layers routes reads, and QRank
        run: |
          sudo mkdir -p /mnt/routes && sudo chown "$USER" /mnt/routes
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 64MB
          # Retry each download, and fail the step if any one fails: a bare
          # `wait` returns 0 regardless, so a connection reset on one layer
          # (water, in run 41895909397) only surfaced as Curate's panic.
          fetch() {
            for i in 1 2 3 4; do
              aws s3 cp --no-progress "s3://hikes-public/layers/$NAMESPACE/$1.pmtiles" "/mnt/routes/$1.pmtiles" && return 0
              echo "Fetching $1.pmtiles failed (attempt $i)"
              sleep $((i * 15))
            done
            return 1
          }
          pids=()
          for layer in ways land water parks peaks pois; do
            fetch "$layer" & pids+=($!)
          done
          wget -q --tries=4 -O /mnt/routes/qrank.db https://github.com/hikeratlas/qrank/releases/download/latest/qrank.db & pids+=($!)
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          # Trail areas (trail networks outside parks, curated like parks): a
          # build from before they existed has none, so they're optional.
          fetch trailareas || echo "::warning::No trailareas.pmtiles in layers/$NAMESPACE/; curating parks only"
          # OSM hiking routes, to check the routes against (known.jsonl): optional too.
          fetch hikingroutes || echo "::warning::No hikingroutes.pmtiles in layers/$NAMESPACE/; no check against known hikes"
          ls -l /mnt/routes
          [ "$failed" = 0 ] || { echo "::error::A layer or QRank download failed"; exit 1; }

      - name: Curate
        run: |
          start=$(date +%s)
          args=()
          for layer in ways land water parks peaks pois trailareas hikingroutes; do
            [ -f "/mnt/routes/$layer.pmtiles" ] && args+=(--tiles "/mnt/routes/$layer.pmtiles")
          done
          routes-src/target/release/routes "${args[@]}" --qrank /mnt/routes/qrank.db \
            --dem-cache /mnt/routes/dem --shard "${{ matrix.shard }}/$SHARDS" --out /mnt/routes/out \
            --park-timeout "$PARK_TIMEOUT" 2> >(tee /mnt/routes/log.txt >&2)
          grep -a '^TIMEOUT: ' /mnt/routes/log.txt | while read -r line; do
            echo "::warning::$line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          done
          grep -a '^searching ' /mnt/routes/log.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "Shard ${{ matrix.shard }}/$SHARDS curated in $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$(ls /mnt/routes/out/raw | wc -l) parks" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routes-log-${{ matrix.shard }}
          path: /mnt/routes/log.txt
          if-no-files-found: ignore

      - name: Upload the shard's routes
        uses: actions/upload-artifact@v4
        with:
          name: routes-raw-${{ matrix.shard }}
          path: /mnt/routes/out/raw/
          if-no-files-found: warn

  merge:
    needs: curate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      AREA: ${{ inputs.area }}
      NAMESPACE: ${{ inputs.namespace || inputs.area }}
      AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: 10
    steps:
      - uses: actions/checkout@v7

      - name: Pre-fetch tilemaker image
        run: nohup ./bin/docker-tilemaker > "$RUNNER_TEMP/tilemaker-prefetch.log" 2>&1 &

      - name: Restore hikeratlas/routes binary
        uses: actions/cache/restore@v6
        with:
          path: routes-src/target/release/routes
          key: routes-bin-${{ runner.arch }}-${{ env.ROUTES_REF }}
          fail-on-cache-miss: true

      # Each shard's DIR/raw/, as shards/<k>/raw/.
      - name: Fetch the shards' routes
        uses: actions/download-artifact@v8
        continue-on-error: true  # none, if no shard had a park
        with:
          pattern: routes-raw-*
          path: shards

      - name: Merge
        run: |
          shopt -s nullglob
          sudo mkdir -p /mnt/routes && sudo chown "$USER" /mnt/routes
          args=()
          for d in shards/routes-raw-*; do
            mkdir -p "$d.dir" && mv "$d" "$d.dir/raw" && args+=(--merge "$d.dir")
          done
          if [ ${#args[@]} = 0 ]; then
            # No parks in any shard (a small preview): nothing to merge.
            mkdir -p /mnt/routes/out/parks && : > /mnt/routes/out/routes.geojsonl
          else
            routes-src/target/release/routes "${args[@]}" --out /mnt/routes/out
          fi
          echo "$(wc -l < /mnt/routes/out/routes.geojsonl) routes in $(ls /mnt/routes/out/parks | wc -l) parks" | tee -a "$GITHUB_STEP_SUMMARY"
          # How many OSM hiking routes the routes find (routes' known.jsonl),
          # and the most notable ones they miss: national and regional
          # networks, then those with a Wikidata item, then the longest.
          if [ -s /mnt/routes/out/known.jsonl ]; then
            python3 - /mnt/routes/out/known.jsonl <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          best = {}
          for line in open(sys.argv[1]):
              k = json.loads(line)
              if k['id'] not in best or k['coverage'] > best[k['id']]['coverage']:
                  best[k['id']] = k
          ks = list(best.values())
          found = sum(k['coverage'] >= 0.7 for k in ks)
          partly = sum(0.3 <= k['coverage'] < 0.7 for k in ks)
          print(f"\n**Known hikes** (OSM hiking routes in or near a park): {len(ks)}; found {found}, partly {partly}, missed {len(ks) - found - partly}\n")
          rank = {'iwn': 0, 'nwn': 1, 'rwn': 2, 'lwn': 3}
          missed = sorted((k for k in ks if k['coverage'] < 0.3),
                          key=lambda k: (rank.get(k.get('network', ''), 4), 'wikidata' not in k, -k['km']))
          if missed:
              print('| missed | network | km | park | best route (coverage) |\n|---|---|---|---|---|')
              for k in missed[:25]:
                  print(f"| [{k['name']}](https://www.openstreetmap.org/relation/{k['id']}) | {k.get('network', '')} | {k['km']} | {k['park']} | {k['best'] or '—'} ({k['coverage']:.0%}) |")
          PY
          fi

      - name: Upload the known-hike check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-hikes
          path: /mnt/routes/out/known.jsonl
          if-no-files-found: ignore

      # tilemaker reads only routes.geojsonl here (see slices/routes.json), so
      # it needs no PBF.
      - name: Build the route layer
        run: |
          cp /mnt/routes/out/routes.geojsonl slices/routes.geojsonl
          cd slices
          ../bin/docker-tilemaker --output routes.pmtiles --config routes.json --process routes.lua \
            --bbox "$(jq -r --arg a "$AREA" '.[$a].bbox' ../areas.json)"
          ls -l routes.pmtiles

      - name: Upload
        run: |
          for i in 1 2 3; do
            aws s3 cp --no-progress slices/routes.pmtiles "s3://hikes-public/layers/$NAMESPACE/routes.pmtiles" \
              && aws s3 sync --no-progress --delete --content-type application/json /mnt/routes/out/parks/ "s3://hikes-public/routes/$NAMESPACE/" \
              && exit 0
            echo "Upload failed (attempt $i)"
            [ "$i" -lt 3 ] && sleep $((i * 30))
          done
          exit 1
