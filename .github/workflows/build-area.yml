name: Build area

# Runs the whole pipeline (exports -> layers -> tile-join, and alongside it
# routes; zindex and the search DB alongside the layers) for one area.
#
# - Every push to main rebuilds nova-scotia into the "nova-scotia" namespace.
# - Every PR builds into its own "pr-<number>/<area>" namespace, so PRs don't
#   clobber main or each other. When the PR is closed or merged, its outputs
#   are deleted from R2. By default a PR builds nova-scotia; a "Preview:" line
#   in its description picks something else (see bin/preview-target.ts):
#     Preview: https://www.openstreetmap.org/node/3046004352
#     Preview: way/123456 radius=25km
#     Preview: ontario
#   For an OSM element, the PR builds just a box around it (at least 10 km in
#   each direction) from the smallest area in areas.json that contains it.
# - A PR skips work its changes can't affect, reusing an existing build's
#   outputs: nova-scotia's for a PR without a "Preview:" line, production
#   north-america's otherwise (it covers every area). The PR comment says which.
#     style-only: only styles/ (or .md) changed. No tiles are built; the
#                 preview's style points at the reused tiles.
#     no-exports: nothing the exports use changed. The layers read the reused
#                 exports' GeoJSON, and search uses their autosuggest DB.
#     full:       anything else, and every push to main.
# - Any area, including north-america, can be built by hand.
#
# Outputs go to R2 under the namespace (which defaults to the area name):
#   geojsonl/<namespace>/, layers/<namespace>/, routes/<namespace>/,
#   <namespace>.pmtiles, <namespace>.routes.pmtiles

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    # edited: a changed "Preview:" line rebuilds (see the config job)
    types: [opened, synchronize, reopened, edited, closed]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        default: nova-scotia
      namespace:
        description: R2 output name (defaults to the area, or test/<area> with a preview), e.g. test/nova-scotia
        type: string
        default: ''
      preview:
        description: Optional, as in a PR's "Preview:" line, e.g. node/3046004352; overrides area
        type: string
        default: ''
      mode:
        description: full, or reuse another build's outputs as a PR would (no-exports, style-only)
        type: choice
        options: [full, no-exports, style-only]
        default: full

# One build per namespace at a time. A newer push or PR update supersedes an
# in-progress build, and closing a PR cancels its build before cleaning up;
# manual builds queue instead of being cancelled. Editing a PR's title (not its
# description) does nothing, so it gets a group of its own rather than
# cancelling the PR's build.
concurrency:
  group: >-
    build-area-${{
      github.event_name == 'pull_request'
      && (github.event.action == 'edited' && !github.event.changes.body
          && format('noop-{0}', github.run_id)
          || format('pr-{0}', github.event.pull_request.number))
      || inputs.namespace || inputs.preview || inputs.area || 'nova-scotia'
    }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  config:
    # PRs from forks don't get the R2 secrets, so skip them. Closed PRs are
    # handled by the cleanup job instead.
    # Edits only rebuild if the description changed (it may have a new
    # "Preview:" line).
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.action != 'closed'
          && (github.event.action != 'edited' || github.event.changes.body))
    runs-on: ubuntu-24.04-arm
    outputs:
      area: ${{ steps.target.outputs.area }}
      bbox: ${{ steps.target.outputs.bbox }}
      view: ${{ steps.target.outputs.view }}
      target: ${{ steps.target.outputs.target }}
      namespace: ${{ steps.config.outputs.namespace }}
      mode: ${{ steps.mode.outputs.mode }}
      reuse_from: ${{ steps.mode.outputs.reuse_from }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The area to build, and for a preview of an OSM element, the box
      - name: Pick what to build
        id: target
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PREVIEW: ${{ inputs.preview }}
          DEFAULT_AREA: ${{ inputs.area || 'nova-scotia' }}
        # PR_BODY is set (maybe empty) only for PRs
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then unset PR_BODY; fi
          bun bin/preview-target.ts

      - id: config
        env:
          AREA: ${{ steps.target.outputs.area }}
          BBOX: ${{ steps.target.outputs.bbox }}
          TARGET: ${{ steps.target.outputs.target }}
          PR: ${{ github.event.pull_request.number }}
          INPUT_NAMESPACE: ${{ inputs.namespace }}
        # A manual preview of part of an area goes to test/<area> unless told
        # otherwise, so it can't replace the area's real build.
        run: |
          if [ -n "$PR" ]; then
            NAMESPACE="pr-$PR/$AREA"
          elif [ -n "$INPUT_NAMESPACE" ]; then
            NAMESPACE="$INPUT_NAMESPACE"
          elif [ -n "$BBOX" ]; then
            NAMESPACE="test/$AREA"
          else
            NAMESPACE="$AREA"
          fi
          echo "namespace=$NAMESPACE" | tee -a "$GITHUB_OUTPUT"
          echo "Building **$TARGET** into \`$NAMESPACE\`${BBOX:+ (box $BBOX)}" >> "$GITHUB_STEP_SUMMARY"

      # How much of the pipeline this PR needs (see the top of this file).
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          INPUT_MODE: ${{ inputs.mode }}
          AREA: ${{ steps.target.outputs.area }}
          BBOX: ${{ steps.target.outputs.bbox }}
          # Files the exports (and the search DB) depend on
          EXPORT_INPUTS: >-
            ^(export/|slices/(json|qrank|file_append)\.lua$|areas\.json$|bin/(docker-tilemaker|create-autosuggest-db\.ts|fetch-pbf)$|pbf-groups\.json$|\.pbf-filter-version$|package\.json$|bun\.lockb$|\.bun-version$|\.github/workflows/(build-area|tilemaker-exports|tilemaker-zindex)\.yml$)
        run: |
          if [ -n "$PR" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
            echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"
            if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
              MODE=full
            elif ! grep -qvE '^styles/|\.md$' "$RUNNER_TEMP/changed.txt"; then
              MODE=style-only
            elif ! grep -qE "$EXPORT_INPUTS" "$RUNNER_TEMP/changed.txt"; then
              MODE=no-exports
            else
              MODE=full
            fi
          else
            MODE=${INPUT_MODE:-full}
          fi
          # nova-scotia is rebuilt on every push to main; production
          # north-america covers everything else.
          if [ "$AREA" = nova-scotia ] && [ -z "$BBOX" ]; then
            REUSE=nova-scotia
          else
            REUSE=north-america
          fi
          echo "mode=$MODE" | tee -a "$GITHUB_OUTPUT"
          echo "reuse_from=$REUSE" | tee -a "$GITHUB_OUTPUT"
          if [ "$MODE" != full ]; then
            echo "Mode **$MODE**: reusing \`$REUSE\`'s outputs" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A "Build progress" check on the commit (#210): the jobs' status and times
  # next to the previous build's (same namespace and mode), the tilemaker
  # runs' phase timings and the routes shards' summaries. This short job
  # creates it; the main jobs' last step (.github/actions/build-progress)
  # re-renders it, and the progress job at the end completes it. Nothing
  # polls, so no runner is held for the build. Informational only: these
  # steps never fail the build.
  progress-start:
    needs: config
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: bin
      - name: Create the progress check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NAMESPACE: ${{ needs.config.outputs.namespace }}
          MODE: ${{ needs.config.outputs.mode }}
          # A comment on the "Build history" issue for manual north-america builds
          HISTORY: ${{ github.event_name == 'workflow_dispatch' && needs.config.outputs.namespace == 'north-america' }}
          # A link to the check at the top of the PR's description
          PR: ${{ github.event.pull_request.number }}
        run: python3 bin/build-progress.py start
      # How later builds find this one to compare with
      - uses: actions/upload-artifact@v4
        with:
          name: build-meta
          path: build-meta.json
          if-no-files-found: ignore
          retention-days: 90

  exports:
    needs: config
    if: needs.config.outputs.mode == 'full'
    permissions:
      actions: write   # the telemetry action reads the job's step times; bin/fetch-pbf may start mirror-pbfs.yml
      checks: write    # the progress check (#210)
      contents: read
    uses: ./.github/workflows/tilemaker-exports.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
      bbox: ${{ needs.config.outputs.bbox }}
    secrets: inherit

  # The zindex export and the search DB built from it. The layers don't use
  # them, so they don't wait for them: only the routes (which add their hikes
  # to the search DB) and deploy-search do (#203). It starts with the exports
  # and waits for their jobs itself.
  zindex:
    needs: config
    if: needs.config.outputs.mode == 'full'
    permissions:
      actions: write   # it polls this run's jobs for the other exports; bin/fetch-pbf may start mirror-pbfs.yml
      checks: write    # the progress check (#210)
      contents: read
    uses: ./.github/workflows/tilemaker-zindex.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
      bbox: ${{ needs.config.outputs.bbox }}
    secrets: inherit

  # The layers that read none of the exports' GeoJSON start straight away:
  # water (the longest, ~12 min for north-america) and land.
  layers-early:
    name: layers
    needs: [config]
    if: ${{ !cancelled() && needs.config.result == 'success' && needs.config.outputs.mode != 'style-only' }}
    permissions:
      actions: write   # the telemetry action reads the job's step times; bin/fetch-pbf may start mirror-pbfs.yml
      checks: write    # the progress check (#210)
      contents: read
    uses: ./.github/workflows/tilemaker-layers.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
      bbox: ${{ needs.config.outputs.bbox }}
      layers: '["land", "water"]'
    secrets: inherit

  layers:
    name: layers
    needs: [config, exports]
    # Runs after the exports, or without them (no-exports)
    if: >-
      !cancelled() && needs.config.result == 'success'
      && needs.config.outputs.mode != 'style-only'
      && (needs.exports.result == 'success' || needs.exports.result == 'skipped')
    permissions:
      actions: write   # the telemetry action reads the job's step times; bin/fetch-pbf may start mirror-pbfs.yml
      checks: write    # the progress check (#210)
      contents: read
    uses: ./.github/workflows/tilemaker-layers.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
      bbox: ${{ needs.config.outputs.bbox }}
      geojsonl_from: ${{ needs.config.outputs.mode == 'no-exports' && needs.config.outputs.reuse_from || '' }}
      layers: '["boundaries", "buildings", "parks", "peaks", "places", "pois", "ways"]'
    secrets: inherit

  # Curated hikes, from the layers just built (see routes.yml). They're an
  # archive of their own, published alongside tile-join's; if curation fails,
  # the map is still published, with the namespace's previous routes.
  # It waits for reuse and zindex too: it adds the hikes to the namespace's
  # search DB, which reuse may copy in from the reused build first, or zindex
  # build. If zindex fails, the routes still run, on the previous search DB.
  routes:
    needs: [config, layers-early, layers, reuse, zindex]
    if: ${{ !cancelled() && needs.layers-early.result == 'success' && needs.layers.result == 'success' && needs.reuse.result != 'failure' }}
    permissions:
      actions: read    # the telemetry action reads the job's step times
      checks: write    # the progress check (#210)
      contents: read
    uses: ./.github/workflows/routes.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
    secrets: inherit

  # A frozen copy of the fixture parks' tiles (hikeratlas/routes'
  # fixtures/parks.json) from this build's finished layers, for routes'
  # fixture CI to compare pull requests on. CI used to extract them from the
  # live layers, which a running build rewrites in place: a read mid-rewrite
  # failed (416), or could silently mix two builds' tiles. Each snapshot is
  # written once to fixtures/<run id>/ and never changed; fixtures/latest.json
  # moves to it only once it's complete.
  fixtures:
    needs: [config, layers-early, layers]
    if: ${{ !cancelled() && needs.layers-early.result == 'success' && needs.layers.result == 'success' && needs.config.outputs.namespace == 'north-america' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: hikeratlas/routes
          path: routes-src

      - name: Extract the fixture tiles
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pmtiles requests
          "$RUNNER_TEMP/venv/bin/python" routes-src/fixtures/extract.py https://public.hikeratlas.com/layers/north-america tiles
          # routes' oracle sample (fixtures/oracle.json): ~160 parks with OSM
          # hiking routes, to measure route-proposer changes against.
          if [ -f routes-src/fixtures/oracle.json ]; then
            "$RUNNER_TEMP/venv/bin/python" routes-src/fixtures/extract.py --parks routes-src/fixtures/oracle.json \
              https://public.hikeratlas.com/layers/north-america tiles/oracle
          fi
          tar czf fixtures.tar.gz tiles
          ls -l fixtures.tar.gz

      - name: Upload, then point latest.json at it
        run: |
          # Must match how routes' fixtures.yml hashes them.
          if [ -f routes-src/fixtures/oracle.json ]; then
            parks=$(cat routes-src/fixtures/parks.json routes-src/fixtures/oracle.json | sha256sum | cut -d' ' -f1)
          else
            parks=$(sha256sum routes-src/fixtures/parks.json | cut -d' ' -f1)
          fi
          aws s3 cp --no-progress fixtures.tar.gz "s3://hikes-public/fixtures/$ID/fixtures.tar.gz"
          jq -n --arg id "$ID" --arg parks "$parks" --arg built "$(date -u +%FT%TZ)" \
            --arg url "https://public.hikeratlas.com/fixtures/$ID/fixtures.tar.gz" \
            '{id: $id, url: $url, parks_sha256: $parks, built: $built}' > latest.json
          cat latest.json
          aws s3 cp --no-progress --content-type application/json --cache-control no-cache latest.json s3://hikes-public/fixtures/latest.json
          echo "Fixture snapshot: https://public.hikeratlas.com/fixtures/$ID/fixtures.tar.gz ($(stat -c %s fixtures.tar.gz) bytes)" >> "$GITHUB_STEP_SUMMARY"

      # Keep the newest 5 snapshots.
      - name: Prune old snapshots
        continue-on-error: true
        run: |
          aws s3 ls s3://hikes-public/fixtures/ | awk '$1 == "PRE" {print $2}' | tr -d / | sort -n | head -n -5 | while read -r old; do
            aws s3 rm --recursive --only-show-errors "s3://hikes-public/fixtures/$old/"
          done

  # The map's layers, merged into <ns>.pmtiles. The curated routes are an
  # archive of their own (<ns>.routes.pmtiles, from the routes job), so this
  # runs alongside them rather than after (#197).
  tile-join:
    needs: [config, layers-early, layers]
    if: ${{ !cancelled() && needs.layers-early.result == 'success' && needs.layers.result == 'success' }}
    permissions:
      actions: read    # the telemetry action reads the job's step times
      checks: write    # the progress check (#210)
      contents: read
    uses: ./.github/workflows/tile-join.yml
    with:
      area: ${{ needs.config.outputs.area }}
      namespace: ${{ needs.config.outputs.namespace }}
    secrets: inherit

  # The main site's search uses the north-america build, so redeploy it with
  # this build's autosuggest DB once the tiles are live and the routes have
  # added their hikes to it, and with hikeratlas/website main's search code,
  # so the two don't drift apart. If the routes fail, the DB has the exports'
  # rows (or the reused build's), as before. Not if zindex failed: the DB
  # would be the previous build's.
  deploy-search:
    needs: [config, tile-join, routes, zindex]
    if: ${{ !cancelled() && needs.tile-join.result == 'success' && needs.zindex.result != 'failure' && needs.config.outputs.namespace == 'north-america' }}
    permissions:
      contents: read
      id-token: write  # deploy-search logs in to AWS with OIDC
    uses: ./.github/workflows/deploy-search.yml
    with:
      namespace: north-america
      website_ref: main
    secrets: inherit

  # Without the exports, publish the reused build's search DB under this
  # namespace, as the exports would. For a style-only change, also publish
  # this branch's style, pointing at the reused tiles: no tiles are built.
  reuse:
    needs: config
    if: needs.config.outputs.mode == 'no-exports' || needs.config.outputs.mode == 'style-only'
    runs-on: ubuntu-24.04-arm
    env:
      AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NAMESPACE: ${{ needs.config.outputs.namespace }}
      REUSE: ${{ needs.config.outputs.reuse_from }}
    steps:
      - name: Copy the search DB
        # Streamed through the runner rather than copied within R2: R2 rejects
        # the CLI's copies one way or another (GetObjectTagging for a big DB
        # like north-america's 51 MB one, copied in parts; the
        # x-amz-tagging-directive header that --copy-props none sends for a
        # small one like nova-scotia's).
        run: aws s3 cp --no-progress "s3://hikes-public/$REUSE.autosuggest.db" - | aws s3 cp --no-progress - "s3://hikes-public/$NAMESPACE.autosuggest.db"

      - uses: actions/checkout@v7
        if: needs.config.outputs.mode == 'style-only'

      - uses: oven-sh/setup-bun@v2
        if: needs.config.outputs.mode == 'style-only'
        with:
          bun-version-file: .bun-version

      - name: Publish style
        if: needs.config.outputs.mode == 'style-only'
        run: |
          bun rm mapt && bun add https://github.com/cldellow/mapt
          bun mapt style "https://public.hikeratlas.com/$REUSE.pmtiles" > "$RUNNER_TEMP/style.json"
          jq -e '.layers | length > 0' "$RUNNER_TEMP/style.json" > /dev/null
          bin/pin-sprites "$RUNNER_TEMP/style.json"
          bin/split-routes-source "$RUNNER_TEMP/style.json" "https://public.hikeratlas.com/$REUSE.routes.pmtiles"
          # no-cache: browsers revalidate on every load (see tile-join.yml).
          aws s3 cp --no-progress --content-type application/json --cache-control no-cache \
            "$RUNNER_TEMP/style.json" "s3://hikes-public/$NAMESPACE.style.json"
          {
            echo "Published https://public.hikeratlas.com/$NAMESPACE.style.json (tiles: $REUSE)"
            echo
            echo "Preview: https://www.hikeratlas.com/map?build=$NAMESPACE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The site's default style, as tile-join.yml publishes it: only for
          # north-america itself, whose tiles the root style points at.
          if [ "$NAMESPACE" = north-america ] && [ "$REUSE" = north-america ]; then
            aws s3 cp --no-progress --content-type application/json --cache-control no-cache \
              "$RUNNER_TEMP/style.json" s3://hikes-public/style.json
            echo "Published https://public.hikeratlas.com/style.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Post (or update) a PR comment linking to the website preview of this build.
  # It waits for the routes too, so the preview has this build's.
  comment:
    needs: [config, tile-join, routes, reuse]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && (needs.tile-join.result == 'success'
          || (needs.config.outputs.mode == 'style-only' && needs.reuse.result == 'success'))
    runs-on: ubuntu-24.04-arm
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      NAMESPACE: ${{ needs.config.outputs.namespace }}
      VIEW: ${{ needs.config.outputs.view }}
      TARGET: ${{ needs.config.outputs.target }}
      MODE: ${{ needs.config.outputs.mode }}
      REUSE: ${{ needs.config.outputs.reuse_from }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Comment with preview link
        run: |
          marker='<!-- build-area-preview -->'
          tiles="$NAMESPACE"
          case "$MODE" in
            style-only) tiles="$REUSE"; note="Style-only change: no tiles were built; the preview uses \`$REUSE\`'s tiles and search." ;;
            no-exports) note="No export changes: the exports were skipped; the layers and search use \`$REUSE\`'s." ;;
            *) note="" ;;
          esac
          body="$marker
          **Preview of ${SHA:0:7}** ($TARGET): https://www.hikeratlas.com/map?build=$NAMESPACE${VIEW:+#$VIEW}
          ${note:+
          $note
          }
          Tiles: https://public.hikeratlas.com/$tiles.pmtiles
          Style: https://public.hikeratlas.com/$NAMESPACE.style.json"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # Completes the progress check once every other job has finished, failed
  # or been cancelled. It waits without a runner.
  progress:
    needs: [config, progress-start, exports, zindex, layers-early, layers, routes, fixtures, tile-join, deploy-search, reuse, comment]
    if: ${{ always() && needs.config.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: bin
      - name: Complete the progress check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 bin/build-progress.py finish

  cleanup:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/cleanup-pr.yml
    with:
      pr: ${{ github.event.pull_request.number }}
    secrets: inherit
