name: Prepare lake centerlines

# Lake, bay and strait names are labelled along a centerline through the
# water (issue #7). This builds those centerlines from the mirrored
# north-america PBF with hikeratlas/lake-centrelines (osm-lakelines' method)
# and publishes them to R2 as lake-centerlines/north-america.geojsonl.zst,
# which the water layer reads.
#
# Run by hand, e.g. after mirroring a newer north-america PBF.

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    env:
      AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: 10

    steps:
      - uses: actions/checkout@v7

      # Pinned, so a change there shows up here as a reviewed bump.
      - uses: actions/checkout@v7
        with:
          repository: hikeratlas/lake-centrelines
          ref: ee02cf37d044d26b11ba34086ee53cfb8ed1b2d3
          path: lake-centrelines

      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      - name: Install osmium, pbf-filter and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version
          python3 -m venv venv && venv/bin/pip install -q -r lake-centrelines/requirements.txt
          # The release named in .pbf-filter-version, as mirror-pbfs.yml uses.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/bin/pbf-filter" \
            "https://github.com/hikeratlas/pbf-filter/releases/download/$(cat .pbf-filter-version)/pbf-filter-aarch64-linux"
          chmod +x "$RUNNER_TEMP/bin/pbf-filter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The mirrored PBF has zstd blocks, which osmium can't read: convert
      # them to zlib.
      - name: Fetch the north-america PBF
        run: |
          start=$(date +%s)
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 64MB
          aws s3 cp --no-progress s3://hikes-public/pbfs/north-america.zstd.pbf north-america.zstd.pbf
          echo "Fetched $(( $(stat -c %s north-america.zstd.pbf) / 1048576 )) MiB in $(( $(date +%s) - start ))s"
          time pbf-filter recompress --zlib north-america.zstd.pbf north-america.pbf
          rm north-america.zstd.pbf

      - name: Build the centerlines
        run: |
          start=$(date +%s)
          PYTHON=venv/bin/python lake-centrelines/lake-centrelines.sh north-america.pbf lake-centerlines.geojsonl
          echo "Built in $(( $(date +%s) - start ))s"
          ls -l lake-centerlines.geojsonl
          head -c 300 lake-centerlines.geojsonl; echo

      # Some R2 failures aren't retried by the CLI (e.g. "InvalidPart"), so
      # retry the whole upload too; see mirror-pbfs.yml.
      - name: Upload
        run: |
          zstd -19 -q lake-centerlines.geojsonl
          for i in 1 2 3; do
            aws s3 cp --no-progress lake-centerlines.geojsonl.zst s3://hikes-public/lake-centerlines/north-america.geojsonl.zst && exit 0
            echo "Upload failed (attempt $i)"
            [ "$i" -lt 3 ] && sleep $((i * 30))
          done
          exit 1
