name: Build tilemaker layers

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        default: north-america
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''
      bbox:
        description: Only build this box (minlon,minlat,maxlon,maxlat) instead of the whole area, e.g. a PR's preview
        type: string
        default: ''
      geojsonl_from:
        description: Read the exports' GeoJSON from this namespace instead of this build's (when the exports were skipped)
        type: string
        default: ''
  workflow_call:
    inputs:
      area:
        description: Area to build; must be a key in areas.json
        type: string
        required: true
      namespace:
        description: R2 output name (defaults to the area), e.g. pr-41/nova-scotia
        type: string
        default: ''
      bbox:
        description: Only build this box (minlon,minlat,maxlon,maxlat) instead of the whole area, e.g. a PR's preview
        type: string
        default: ''
      geojsonl_from:
        description: Read the exports' GeoJSON from this namespace instead of this build's (when the exports were skipped)
        type: string
        default: ''

jobs:
  build:
    # arm64 runners have 4 full cores, where x64 ones have 2 cores with 2
    # hyperthreads each. On north-america, tilemaker built the layers 1.48x
    # faster on them (ways: 29 -> 20 minutes); see hikeratlas/basemap#52.
    # The tilemaker image is multi-arch.
    runs-on: ubuntu-24.04-arm
    env:
      AREA: ${{ inputs.area }}
      # Where outputs go in R2: geojsonl/<ns>/, layers/<ns>/, <ns>.pmtiles
      NAMESPACE: ${{ inputs.namespace || inputs.area }}

    strategy:
      matrix:
        layer: [
          boundaries,
          buildings,
          land,
          parks,
          peaks,
          places,
          pois,
          water,
          ways
        ]
    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"

      # No "Maximize build space" step: arm64 runners start with ~107G free
      # on /, and the largest layer (ways) peaks around 45G (15.8G PBF + ~21G
      # tilemaker store + output). The cleanup took 1-2.5 minutes per job.

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Runner details, a waterfall of the steps, and CPU, memory, disk and
      # network charts in the job summary; the numbers go to the log too. Needs
      # the checkout, so it doesn't sample the steps above.
      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      # Where this job's run is, in the progress check every few minutes (#210)
      - name: Live progress
        continue-on-error: true
        uses: ./.github/actions/build-progress
        with:
          live: layer-${{ matrix.layer }}

      # Pull the tilemaker image in the background so it overlaps with the PBF
      # download. With no arguments, tilemaker prints its usage and exits.
      # Background processes keep running across steps until the job ends.
      - name: Pre-fetch tilemaker image
        run: nohup ./bin/docker-tilemaker > "$RUNNER_TEMP/tilemaker-prefetch.log" 2>&1 &

      - name: Read area config
        id: area
        env:
          BBOX_OVERRIDE: ${{ inputs.bbox }}
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | grep -v '^bbox=' | tee -a "$GITHUB_OUTPUT"
          # A preview build only covers its box; otherwise, the whole area.
          echo "bbox=${BBOX_OVERRIDE:-$(jq -r --arg a "$AREA" '.[$a].bbox' areas.json)}" | tee -a "$GITHUB_OUTPUT"

      # A pinned version lets setup-bun use its cache; "latest" downloads from
      # bun.sh every time, which once took 2.5 minutes of retries after a 522.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install mapt
        run: bun rm mapt && bun add https://github.com/cldellow/mapt

      # Fetch from R2 directly with many concurrent ranged GETs; a single wget
      # stream over the public URL tops out around 70 MB/s.
      - name: Fetch PBF
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 64MB
          start=$(date +%s)
          aws s3 cp --no-progress "s3://hikes-public/pbfs/$AREA.zstd.pbf" "$AREA.pbf"  # see mirror-pbfs.yml
          secs=$(( $(date +%s) - start ))
          echo "Downloaded $(( $(stat -c %s "$AREA.pbf") / 1048576 )) MiB in ${secs}s"

      - name: Fetch supporting GeoJSON and QRank files
        env:
          GEOJSONL_FROM: ${{ inputs.geojsonl_from }}
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          wget --progress=dot:giga https://github.com/hikeratlas/qrank/releases/download/latest/qrank.db
          aws s3 sync "s3://hikes-public/geojsonl/${GEOJSONL_FROM:-$NAMESPACE}/" . --no-progress
          unzstd *.zst
          # A reused build from before the campgrounds export has none.
          if [ ! -f campgrounds.geojsonl ]; then
            echo "::warning::No campgrounds.geojsonl in geojsonl/${GEOJSONL_FROM:-$NAMESPACE}/ (built before that export existed); using an empty one"
            touch campgrounds.geojsonl
          fi
          # Likewise the trails export (bin/trail-areas.py): no trail areas.
          if [ ! -f trails.geojsonl ]; then
            echo "::warning::No trails.geojsonl in geojsonl/${GEOJSONL_FROM:-$NAMESPACE}/ (built before that export existed); no trail areas"
            touch trails.geojsonl
          fi
          # And the hiking-routes export: no known hikes for routes to check.
          if [ ! -f hiking-routes.geojsonl ]; then
            echo "::warning::No hiking-routes.geojsonl in geojsonl/${GEOJSONL_FROM:-$NAMESPACE}/ (built before that export existed); no known hikes"
            touch hiking-routes.geojsonl
          fi

      # Parking and trailheads within 2 km of a park stay in the poi layer
      # (see slices/pois.lua); this grows the parks by 2 km for that check.
      # Only parks that reach the build's box (a preview's, or the area's).
      - name: Grow parks for nearby parking
        if: ${{ matrix.layer == 'pois' }}
        env:
          BBOX: ${{ steps.area.outputs.bbox }}
        run: |
          start=$(date +%s)
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q shapely
          "$RUNNER_TEMP/venv/bin/python" bin/parks-near.py parks.geojsonl parks-near.geojsonl 2000 ${BBOX:+--bbox "$BBOX"}
          echo "Grew parks in $(( $(date +%s) - start ))s"; ls -l parks-near.geojsonl

      # Trail networks outside parks that hikeratlas/routes curates as it does
      # parks (see bin/trail-areas.py): the pois layer keeps POIs inside them,
      # and the parks job publishes them for routes as trailareas.pmtiles.
      - name: Find trail areas
        if: ${{ matrix.layer == 'pois' || matrix.layer == 'parks' }}
        env:
          BBOX: ${{ steps.area.outputs.bbox }}
        run: |
          start=$(date +%s)
          python3 -m venv "$RUNNER_TEMP/venv-trails" && "$RUNNER_TEMP/venv-trails/bin/pip" install -q shapely numpy
          "$RUNNER_TEMP/venv-trails/bin/python" bin/trail-areas.py trails.geojsonl parks.geojsonl trail-areas.geojsonl ${BBOX:+--bbox "$BBOX"}
          echo "Found trail areas in $(( $(date +%s) - start ))s"; ls -l trail-areas.geojsonl

      # Where parking lots are urban (see bin/urban-lots.py): slices/pois.lua
      # marks those lots, and the style hides them.
      - name: Find urban parking
        if: ${{ matrix.layer == 'pois' }}
        env:
          BBOX: ${{ steps.area.outputs.bbox }}
        run: |
          start=$(date +%s)
          "$RUNNER_TEMP/venv-trails/bin/python" bin/urban-lots.py trails.geojsonl urban-lots.geojsonl ${BBOX:+--bbox "$BBOX"}
          echo "Found urban parking in $(( $(date +%s) - start ))s"; ls -l urban-lots.geojsonl

      # Only hikeratlas/routes reads trail areas, so they're their own file,
      # which tile-join leaves out of the map. tilemaker reads only
      # trail-areas.geojsonl here (see slices/trailareas.json): no PBF needed.
      - name: Build and upload trail areas
        if: ${{ matrix.layer == 'parks' }}
        env:
          BBOX: ${{ steps.area.outputs.bbox }}
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd slices
          ../bin/docker-tilemaker --output trailareas.pmtiles --config trailareas.json --process trailareas.lua --bbox "$BBOX"
          ls -l trailareas.pmtiles
          for i in 1 2 3; do
            aws s3 cp --no-progress trailareas.pmtiles "s3://hikes-public/layers/$NAMESPACE/trailareas.pmtiles" && exit 0
            echo "Upload failed (attempt $i)"; sleep $((i * 15))
          done
          exit 1

      # OSM hiking route relations, which hikeratlas/routes checks its routes
      # against: like trail areas, their own file, left out of the map.
      - name: Build and upload hiking routes
        if: ${{ matrix.layer == 'parks' }}
        env:
          BBOX: ${{ steps.area.outputs.bbox }}
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "$(wc -l < hiking-routes.geojsonl) hiking route relations"
          cd slices
          ../bin/docker-tilemaker --output hikingroutes.pmtiles --config hikingroutes.json --process hikingroutes.lua --bbox "$BBOX"
          ls -l hikingroutes.pmtiles
          for i in 1 2 3; do
            aws s3 cp --no-progress hikingroutes.pmtiles "s3://hikes-public/layers/$NAMESPACE/hikingroutes.pmtiles" && exit 0
            echo "Upload failed (attempt $i)"; sleep $((i * 15))
          done
          exit 1

      # Lake labels follow these centerlines; see lake-centerlines.yml.
      - name: Fetch lake centerlines
        if: ${{ startsWith(matrix.layer, 'water') }}
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if aws s3 cp --no-progress s3://hikes-public/lake-centerlines/north-america.geojsonl.zst lake-centerlines.geojsonl.zst; then
            unzstd -f lake-centerlines.geojsonl.zst
          else
            echo "::warning::No lake centerlines in R2 (run lake-centerlines.yml); lakes won't be labelled"
            touch lake-centerlines.geojsonl
          fi
          ls -l lake-centerlines.geojsonl


      # The coastline is an 865MB zip from osmdata.openstreetmap.de that downloads
      # at ~20 MB/s and takes ~10s to unzip, so cache the unzipped shapefiles.
      # The upstream data changes daily; keying by ISO week refreshes it weekly.
      - name: Compute coastline cache key
        if: ${{ startsWith(matrix.layer, 'boundaries') }}
        id: coastline-key
        run: echo "week=$(date -u +%G-W%V)" | tee -a "$GITHUB_OUTPUT"

      - name: Restore cached coastline
        if: ${{ startsWith(matrix.layer, 'boundaries') }}
        id: coastline-cache
        uses: actions/cache@v6
        with:
          path: slices/coastline
          key: coastline-${{ steps.coastline-key.outputs.week }}

      - name: Fetch coastline
        if: ${{ startsWith(matrix.layer, 'boundaries') && steps.coastline-cache.outputs.cache-hit != 'true' }}
        run: wget --progress=dot:giga https://osmdata.openstreetmap.de/download/water-polygons-split-4326.zip && unzip water-polygons-split-4326.zip && mv water-polygons-split-4326 slices/coastline

      - name: Build layer
        env:
          TILEMAKER: ${{ github.workspace }}/bin/docker-tilemaker
          LAYER: ${{ matrix.layer }}
          BBOX: ${{ steps.area.outputs.bbox }}
        # tilemaker's output, timestamped, for the phase timings below (#210)
        run: |
          set -o pipefail
          bun mapt build "$AREA".pbf $LAYER -- --fast ${BBOX:+--bbox "$BBOX"} 2>&1 \
            | python3 bin/timestamp-lines.py "$RUNNER_TEMP/tilemaker.log"

      # Where tilemaker spent its time, for build-area.yml's "Build progress"
      # check (#210).
      - name: Phase timings
        if: always()
        continue-on-error: true
        uses: ./.github/actions/phase-timings
        with:
          name: layer-${{ matrix.layer }}

      # The slices ask tilemaker for zstd tiles. Byte 98 of a PMTiles v3
      # header is the tile compression, and 4 means zstd.
      - name: Check tile compression
        env:
          FILE: ${{ matrix.layer }}.pmtiles
        run: |
          c=$(od -An -tu1 -j98 -N1 "$FILE" | tr -d ' ')
          echo "$FILE: tile compression $c"
          [ "$c" = 4 ] || { echo "::error::$FILE does not have zstd tiles"; exit 1; }

      - name: Upload layer tiles
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
          FILE: ${{ matrix.layer }}.pmtiles
        run: |
          aws configure set default.s3.multipart_chunksize 128MB
          for i in 1 2 3 4; do
            aws s3 cp --no-progress "$FILE" "s3://hikes-public/layers/$NAMESPACE/$FILE" && exit 0
            echo "Upload attempt $i failed; retrying in $((i*30))s"
            sleep $((i*30))
          done
          exit 1

      # Re-render build-area.yml's progress check with this job's results (#210)
      - name: Build progress
        if: always()
        continue-on-error: true
        uses: ./.github/actions/build-progress
