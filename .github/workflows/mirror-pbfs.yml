name: Mirror PBFs from Geofabrik

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to mirror; must be a key in areas.json
        type: string
        default: north-america

jobs:
  mirror:
    runs-on: ubuntu-24.04-arm
    env:
      AREA: ${{ inputs.area }}

    steps:
      - name: Runner diagnostics
        continue-on-error: true
        run: |
          echo "::group::OS / image"
          uname -a
          grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release || true
          echo "Runner: ${RUNNER_NAME:-?} image=${ImageOS:-?} ${ImageVersion:-?} arch=${RUNNER_ARCH:-?}"
          echo "::endgroup::"
          echo "::group::CPU"
          lscpu
          nproc
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          swapon --show || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT || true
          echo "::endgroup::"
          echo "::group::Azure VM metadata"
          VMSIZE=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" || true)
          LOCATION=$(curl -s --max-time 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || true)
          echo "vmSize=${VMSIZE:-unknown} location=${LOCATION:-unknown}"
          echo "::endgroup::"

      - uses: actions/checkout@v7

      # Runner details, a waterfall of the steps, and CPU, memory, disk and
      # network charts in the job summary; the numbers go to the log too. Needs
      # the checkout, so it doesn't sample the steps above.
      - name: Collect resource telemetry
        uses: ./.github/actions/telemetry

      - name: Read area config
        id: area
        run: |
          if ! jq -e --arg a "$AREA" 'has($a)' areas.json > /dev/null; then
            echo "::error::Unknown area '$AREA'; add it to areas.json"
            exit 1
          fi
          jq -r --arg a "$AREA" '.[$a] | to_entries[] | "\(.key)=\(.value)"' areas.json | tee -a "$GITHUB_OUTPUT"

      - name: Fetch PBF
        env:
          GEOFABRIK: ${{ steps.area.outputs.geofabrik }}
        run: wget --progress=dot:giga "https://download.geofabrik.de/${GEOFABRIK}-latest.osm.pbf" -O "$AREA".pbf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version

      # An area with "clip" keeps only what's inside those Geofabrik extracts'
      # outlines: north-america is Canada and the US, without Mexico, Greenland
      # or Saint-Pierre-et-Miquelon (basemap#158). The land still shows (it's
      # drawn from the coastline's water polygons), with nothing on it. "smart"
      # keeps whole any way or multipolygon partly inside, e.g. the boundary.
      - name: Clip to the area's countries
        if: ${{ steps.area.outputs.clip != '' }}
        env:
          CLIP: ${{ steps.area.outputs.clip }}
        run: |
          polys=()
          for c in $CLIP; do
            wget -q "https://download.geofabrik.de/$c.poly" -O "$(basename "$c").poly"
            polys+=("$(basename "$c").poly")
          done
          python3 bin/combine-polys.py "$AREA" "${polys[@]}" > clip.poly
          grep -c '^END' clip.poly
          osmium extract -p clip.poly -s smart "$AREA".pbf -o clipped.pbf --overwrite
          ls -l "$AREA".pbf clipped.pbf
          mv clipped.pbf "$AREA".pbf

      # The builds read <area>.zstd.pbf: the same data, minus the version and
      # timestamp metadata that tilemaker never reads, with zstd blocks instead
      # of zlib ones (cldellow/tilemaker reads both). osmium can't write zstd
      # blocks, so it writes uncompressed ones to bin/pbf-zstd.ts.
      - name: Make zstd PBF
        run: |
          osmium cat "$AREA".pbf -f pbf,add_metadata=false,pbf_compression=none -o - \
            | bun bin/pbf-zstd.ts - "$AREA".zstd.pbf
          ls -l "$AREA".pbf "$AREA".zstd.pbf

      # The original (clipped, if the area is) is kept too, so builds can
      # switch back to it.
      - name: Upload PBFs
        env:
          AWS_ENDPOINT_URL: https://ce5627cfc65c8b54d40bb91c0ba7298b.r2.cloudflarestorage.com
          AWS_EC2_METADATA_DISABLED: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # R2 sometimes fails a request (e.g. a 500 InternalError); let the
          # CLI retry those, as tile-join's upload does.
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
        # Some failures aren't retried by the CLI, e.g. "InvalidPart" when
        # completing a multipart upload, so also retry each whole upload.
        run: |
          upload() {
            for i in 1 2 3; do
              aws s3 cp --no-progress "$1" s3://hikes-public/pbfs/ && return 0
              echo "Uploading $1 failed (attempt $i)"
              [ "$i" -lt 3 ] && sleep $((i * 30))
            done
            return 1
          }
          upload "$AREA".pbf
          upload "$AREA".zstd.pbf

