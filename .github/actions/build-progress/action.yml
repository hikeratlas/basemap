name: Build progress
description: >
  Updates build-area.yml's "Build progress" check (#210). Without inputs,
  as a job's last step (with if: always()): merges this job's phase timings
  and routes summary ($RUNNER_TEMP/phases-*.json, routes-summary-*.json)
  into the check and re-renders it. With live:, early in a long job: starts
  a background loop that puts where the job's run is now (from its log)
  into the check every few minutes until the job ends, and the same into
  the build's progress comment. The job needs checks: write, issues: write
  and actions: read. It never fails the job.
inputs:
  live:
    description: Name of the run for the live loop, e.g. layer-ways; empty for an update.
    default: ''
  kind:
    description: For live, the log's format, tilemaker (timestamped by bin/timestamp-lines.py) or routes.
    default: tilemaker
  log:
    description: For live, the log to follow.
    default: ${{ runner.temp }}/tilemaker.log
runs:
  using: composite
  steps:
    - name: Update the progress check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        LIVE: ${{ inputs.live }}
        KIND: ${{ inputs.kind }}
        LOG: ${{ inputs.log }}
      run: |
        if [ -n "$LIVE" ]; then
          # Ends with the job: the runner stops leftover processes.
          nohup python3 bin/build-progress.py live "$LIVE" "$KIND" "$LOG" > "$RUNNER_TEMP/build-progress-live.log" 2>&1 &
        else
          python3 bin/build-progress.py update || true
        fi
